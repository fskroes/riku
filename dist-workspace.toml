[workspace]
members = ["cargo:crates/riku"]

[dist]
# cargo-dist generates the tagged GitHub Release and updates the personal tap.
cargo-dist-version = "0.32.0"
ci = "github"
installers = ["homebrew"]
tap = "fskroes/homebrew-riku"
publish-jobs = ["homebrew"]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
hosting = "github"
install-updater = false
