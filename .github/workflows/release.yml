name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      manifest: ${{ steps.plan.outputs.manifest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Build embedded UI
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Install cargo-dist
        run: cargo install cargo-dist --locked --version 0.32.0
      - id: plan
        run: |
          cargo dist plan --output-format=json > dist-manifest.json
          echo "manifest=$(jq -c . dist-manifest.json)" >> "$GITHUB_OUTPUT"

  build-local-artifacts:
    needs: plan
    strategy:
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: macos-13
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build embedded UI
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Install cargo-dist
        run: cargo install cargo-dist --locked --version 0.32.0
      - name: Build artifacts
        run: cargo dist build --artifacts=local --target=${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.target }}
          path: target/distrib/*

  host-and-publish:
    needs: [plan, build-local-artifacts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: target/distrib
          pattern: artifacts-*
          merge-multiple: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-dist
        run: cargo install cargo-dist --locked --version 0.32.0
      - name: Publish GitHub Release and Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: cargo dist host --steps=create,upload,release,announce,homebrew
