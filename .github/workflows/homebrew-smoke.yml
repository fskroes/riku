name: Source-install smoke test

on:
  pull_request:
  push:
    branches: [main]

# Read-only: this job only builds and exercises the source install.
permissions:
  contents: read

jobs:
  smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build embedded UI and test workspace
        run: |
          cd web && npm ci && npm run build
          cd .. && cargo test --workspace
      # The formula is generated into fskroes/homebrew-riku on a tagged release.
      # This smoke path deliberately exercises the same source-build sequence.
      - name: Source-install smoke test
        run: |
          cd web && npm ci && npm run build
          cd .. && cargo install --path crates/riku --root "$RUNNER_TEMP/riku"
          "$RUNNER_TEMP/riku/bin/riku" --help
