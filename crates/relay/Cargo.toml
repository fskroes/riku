[package]
name = "relay"
version.workspace = true
edition.workspace = true
license.workspace = true

# Two headless binaries plus the shared wire library. The Relay fans Collector
# updates out to boards; the Collector watches one machine's sessions and pushes
# them up. Both share the `collector` crate (Session model, store, watcher) and
# this crate's wire codec + token auth, so a remote card carries the same stats a
# local one does (ADR 0001: shared code, not a second pipeline).
[[bin]]
name = "relay"
path = "src/bin/relay.rs"

[[bin]]
name = "collector"
path = "src/bin/collector.rs"

[dependencies]
collector = { path = "../collector" }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
tokio-stream = { version = "0.1", features = ["sync"] }
axum = "0.7"
futures = "0.3"
hostname = "0.4"
# HTTP client for the Collector's push and the board's subscription. No TLS
# feature: the Relay speaks plain HTTP (TLS termination is an operator concern,
# out of scope for this ticket — see ADR 0007).
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }

[dev-dependencies]
tempfile = "3"
