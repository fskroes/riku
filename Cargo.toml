[workspace]
resolver = "2"
members = ["crates/sessions", "crates/session-engine", "crates/board", "crates/relay", "crates/riku"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/fskroes/riku"
homepage = "https://github.com/fskroes/riku"
description = "A local mission-control board for AI coding agent sessions"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }

# The optimized profile dist builds release artifacts under (added for cargo-dist).
[profile.dist]
inherits = "release"
lto = "thin"
